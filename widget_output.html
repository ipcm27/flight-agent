
<html>
<head>
<style>
    body {
        font-family: Arial;
        background: white;
        padding: 30px;
    }
    .card {
        width: 350px;
        padding: 20px;
        border-radius: 20px;
        color: white;
        background: #996699;
        box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    .title {
        font-size: 26px;
        font-weight: bold;
        margin-bottom: 15px;
        text-align:center;
    }
    .label {
        opacity: 0.8;
        font-size: 12px;
    }
    .value {
        font-size: 20px;
        font-weight: 600;
    }
</style>
</head>
<body>
<div class="card">
    <div class="title"></div>

    <div>
        <div class="label">From</div>
        <div class="value">Recife (REC) - Information not available without booking engine</div>
    </div>

    <br/>

    <div>
        <div class="label">To</div>
        <div class="value">São Paulo (GRU or CGH) - Information not available without booking engine</div>
    </div>
</div>
</body>
</html>
